# STANDARDS.md and docs/STYLE.md section 3 both mandate American spelling.
# We mandated it and enforced nothing: 133 British spellings were sitting in
# the corpus when this rule was written, measured 2026-08-11. Found by trialling
# LanguageTool, which flagged `generalisable` in one document; the general rule
# was then cheap to write here and needs no Java and no dictionary.
#
# EXPLICIT swaps rather than a regex with a capture group, and the reason is
# NOT that vale rejects them. This comment claimed E201 until 2026-08-11, when
# a probe swapped `(behaviou|colou)r: $1r` and vale substituted it correctly.
# One malformed pattern was generalised into a property of the tool, and the
# claim then steered two repositories away from a construct that works. The
# explicit list stays because these are irregular pairs rather than one
# inflection, so a capture would not shorten it.
extends: substitution
message: "British spelling: use '%s'."
level: warning
ignorecase: true
swap:
