name: Bug
description: Something built, loaded or mounted and then misbehaved
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Read doc/README.status.md first: it says what has been measured
        and on which build, so a report can say what differed.
  - type: input
    id: kernel
    attributes:
      label: Kernel version
      placeholder: uname -r
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include dmesg. HAMMER2 messages carry the function name.
    validations:
      required: true
  - type: textarea
    id: volume
    attributes:
      label: The volume
      description: Which implementation wrote it, and with what newfs_hammer2 arguments.
  - type: textarea
    id: gates
    attributes:
      label: Gate output
      description: The gate or fleet script that reads the surface, if one does; doc/README.testing.md names them.
      render: shell
