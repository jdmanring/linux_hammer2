# Every gate, on every push and pull request.
#
# This workflow is live. The repository is public and Actions is enabled,
# so a push runs it and the README badge reports a real result. That was
# not true when this file was written, and the comment saying so outlived
# its subject by long enough to mislead: a claim about what is currently
# switched off has a shelf life measured in days, and nothing here
# rechecks one. Read the badge or the Actions tab for the state; this
# comment describes the mechanism only.
#
# What IS unexercised is any step added since the last green run. A step
# that has never run on a runner is not evidence, however well it behaves
# locally, because the runner differs in what it has installed.
#
# The syntax gate needs kernel headers 6.15 or newer, which a runner may
# not have. That floor is the module's own, enforced by an #error in
# hammer2_os.h and measured rather than guessed: BLK_MAX_BLOCK_SIZE is
# absent in v6.14 and present in v6.15. Below it the compile fails outright
# rather than reporting could-not-run, so a runner with older headers is a
# real failure and not a skip. The gate reports exit 2 for "could not run"
# when the headers are absent altogether, and this job records that as a
# skip rather than a pass, because a gate that cannot run and a gate that
# passed must not print the same thing.
#
# The repository gates run first and unconditionally. They are POSIX sh
# over grep, sed and git, so a runner cannot fail to provide what they
# need, and they are what a documentation-only patch breaks.
name: CI

on:
  push:
  pull_request:
  # On demand as well. A push is the normal trigger, but on 2026-08-26 a
  # push updated main and no run appeared for ten minutes while a rerun of
  # an older run queued immediately, so the runner was working and the
  # event was not. Without this the only way to ask for a verdict on a
  # given commit is an empty commit, which puts a lie in the history to
  # work around an outage.
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # v7.0.1 is current; v4 targeted Node 20 and the runner was forcing
      # it onto Node 24 with a deprecation notice. The pin rule applies to
      # the actions as much as to the kernel and the style checker.
      - uses: actions/checkout@v7
        with:
          # test-history.sh resolves every roadmap row's commit hash, so a
          # shallow clone would fail it on rows older than the fetch depth.
          fetch-depth: 0

      - name: Toolchain and kernel headers
        run: |
          sudo apt-get update -qq
          # libxxhash-dev turns the vectors gate's behavioural half from
          # COULD-NOT-RUN into a real run: without an xxHash to link, it
          # checks the source contract only and says so.
          sudo apt-get install -y clang libxxhash-dev || echo "toolchain incomplete"
          sudo apt-get install -y "linux-headers-$(uname -r)" || \
            echo "no headers for $(uname -r)"

      - name: Kernel style checker, pinned to the kernel of record
        run: |
          # The baseline records this file's sha256, so the gate identifies
          # the checker by content rather than by what anyone says it is.
          # v7.2 because the checker should be the one shipping with the
          # kernel this tree compiles against, not the module's 6.15 floor.
          curl -sSLo /tmp/checkpatch.pl \
            https://raw.githubusercontent.com/torvalds/linux/v7.2/scripts/checkpatch.pl
          echo "CHECKPATCH=/tmp/checkpatch.pl" >> "$GITHUB_ENV"

      # THE GATE LIST IS DERIVED, NOT TYPED. It was typed until 2026-08-26
      # and had already fallen behind: script/test-vectors-contract.sh
      # existed for hours with CI not running it, and a document DISCLOSED
      # that instead of fixing it, which is the could-have-didn't shape. A
      # hand-maintained list of the things that check this tree is the same
      # defect those checks exist to catch, and ArtNix's delegator - which
      # runs these same gates from another repository - derived its
      # population from `ls` a day earlier for exactly this reason.
      #
      # Exit 2 is COULD-NOT-RUN and is recorded as a skip, never as a pass.
      # A failure outranks it: rc is kept per gate rather than folded, so a
      # gate exiting 1 cannot be reported as "could not run" merely because
      # something else declined. The syntax gate takes that path on every
      # hosted runner, since the kernel of record is the latest release and
      # ubuntu-latest ships headers years behind it.
      # THE ORIGIN CLONE, so the provenance gate's one check with teeth is
      # not confined to the machine the imports were made on. Without it
      # that gate can only establish the table agrees with itself, and it
      # says so and exits 2; with it, every "identical" row is re-run
      # through cmp on every push.
      #
      # The commit is read out of the CSV rather than written here. Pinned
      # in two places it would drift, and the copy that drifted would be
      # the one nothing reads. A clone that fails leaves the gate exactly
      # where it was - COULD-NOT-RUN, reported as a skip - so this step
      # can add verification and cannot take any away.
      - name: Origin clone for the provenance gate
        continue-on-error: true
        run: |
          set +e
          commit=$(awk -F, '$2 == "freebsd-hammer2-upstream" {print $3; exit}' \
            doc/provenance.csv)
          [ -n "$commit" ] || { echo "::warning::no freebsd row in the CSV"; exit 0; }
          d="$HOME/Projects/freebsd-hammer2-upstream"
          mkdir -p "$HOME/Projects"
          git clone --quiet https://github.com/kusumi/freebsd_hammer2 "$d" || {
            echo "::warning::clone failed; the provenance gate stays COULD-NOT-RUN"
            exit 0
          }
          git -C "$d" checkout --quiet "$commit" || {
            echo "::warning::$commit not in the clone; gate stays COULD-NOT-RUN"
            rm -rf "$d"
            exit 0
          }
          echo "origin clone at $commit"

      # Vale, for the prose gate. Without it that gate reports COULD-NOT-RUN,
      # which is what it did on every run from 2026-08-29, when doc/research
      # arrived from ArtNix with its gate, until 2026-09-02. The whole point of
      # moving the gate with the files was that the prose not sit ungoverned,
      # and a gate that only runs on a maintainer's own machine governs nothing.
      #
      # Pinned by version and checksum rather than tracking latest: a different
      # vale reports a different finding set on unchanged prose, the same reason
      # checkpatch is pinned to the kernel of record. Failing to install is a
      # real failure here, not a skip, because the gate would otherwise print
      # could-not-run and the run would still be green.
      - name: Prose checker, pinned
        run: |
          set -eu
          v=3.18.0
          sha=a6f71a75a12fe689345b754f2412b90367fe33648abb7d200fa19eaadc2dbf6d
          curl -sfL -o /tmp/vale.tgz \
            "https://github.com/errata-ai/vale/releases/download/v$v/vale_${v}_Linux_64-bit.tar.gz"
          echo "$sha  /tmp/vale.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/vale.tgz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vale" --version

      # THE BUILD. It must succeed, and it must be warning-clean.
      #
      # It asserted a FAILURE from 2026-09-02 until hammer2_strategy.c landed
      # the same day: modpost reported four undefined symbols, three of them
      # that file's and the fourth hammer2_vfs_sync_pmp(), which had been
      # left undefined on purpose. The three are floors now and the fourth is
      # one too, so the module links and 0.3's first criterion is met.
      #
      # It runs BEFORE the gates deliberately. Until the first build no gate
      # had ever seen a built tree, and that first one turned two of them red
      # by putting .o and .cmd files where they enumerate source. Building
      # here means every later step runs against the tree a developer has, so
      # that class cannot come back unnoticed.
      #
      # Warning-clean is the half most likely to rot: kbuild's flag set is
      # wider than the syntax gate's was, and the difference was seven
      # warnings nobody had seen.
      - name: Module build
        run: |
          # set +e because this step's shell runs under -e: without it a
          # nonzero build-check.sh aborts here and the rc read below never
          # happens, which makes COULD-NOT-RUN unreachable and reports it as
          # whatever -e does instead.
          set +e
          sh script/build-check.sh
          rc=$?
          case "$rc" in
            0) modinfo src/sys/fs/hammer2/hammer2.ko |
                 grep -E "^(license|alias|depends):" ;;
            2) echo "::warning::no kernel build dir, the module build could not run" ;;
            *) echo "::error::the module build is not clean"; exit 1 ;;
          esac

      - name: Gates (every script/test-*.sh)
        run: |
          set +e
          rc=0 ran=0 unrun=0
          for g in script/test-*.sh; do
            echo "::group::$g"
            bash "$g"
            s=$?
            echo "::endgroup::"
            case "$s" in
              0) ran=$((ran+1)) ;;
              2) unrun=$((unrun+1)); echo "::warning::$g COULD-NOT-RUN on this runner" ;;
              *) rc=1; echo "::error::$g failed with $s" ;;
            esac
          done
          echo "$ran gate(s) ran, $unrun could not run"
          [ "$rc" = 0 ] || exit 1
          [ "$ran" -gt 0 ] || { echo "::error::every gate declined"; exit 1; }

      # THE SELFTESTS, and this list is derived too. A print with no test is
      # a claim about output nobody checks, and these prints are what keeps
      # a loosened run from reading like a real one.
      - name: Gate selftests (the provenance prints)
        run: |
          set +e
          rc=0
          # ANCHORED ON THE IMPLEMENTATION, NOT THE NAME. Matching the
          # bare flag picked up script/test-posix.sh, which only MENTIONS
          # --selftest in a comment describing the defect it exists for, so
          # CI ran that gate a second time with an argument it ignores. Same
          # lesson as the vectors gate, whose pattern matched the comment
          # quoting its own contract: in a file that documents itself, a
          # token check finds the prose.
          for g in $(command grep -l '"${1:-}" = "--selftest"' script/test-*.sh); do
            bash "$g" --selftest
            s=$?
            case "$s" in
              0) ;;
              2) echo "::warning::$g selftest COULD-NOT-RUN here" ;;
              *) rc=1; echo "::error::$g selftest failed with $s" ;;
            esac
          done
          exit "$rc"

  # THE DECLARED FLOOR, BUILT.
  #
  # hammer2_os.h carries an #error asserting 6.15, README.status.md justifies
  # it with BLK_MAX_BLOCK_SIZE, and until this job nothing had ever put a
  # compiler on it. That gap cost twice on 2026-09-03: inode_state_read_once()
  # needs 6.19 and kzalloc_obj() needs 7.0, and both surfaced as implicit
  # declarations in the middle of a build against a NEWER kernel rather than
  # at the #error that exists to say a kernel is too old. A floor nothing
  # compiles is an assertion, not a constraint.
  #
  # script/floor-symbols.py bounds the same class by resolving names against
  # the floor tree's include/. It does not compile, so a signature that
  # changed while keeping its name, or a macro that stopped expanding, is
  # invisible to it. This job is what closes it.
  #
  # The expensive half is modules_prepare, minutes on a hosted runner. It is
  # cached on the TAG, which is immutable, so it is paid once and restored
  # thereafter; a cache miss costs time and changes no verdict. The tarball
  # comes from cdn.kernel.org rather than a git clone because the tag is all
  # that is wanted and a clone of Linux is far larger than one release.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain for an out-of-tree module build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison flex libelf-dev libssl-dev

      - name: Cache the prepared floor tree
        id: floorcache
        uses: actions/cache@v4
        with:
          path: ~/linux-floor
          # The version appears once. Bumping the floor means editing this
          # line and the #error in hammer2_os.h, and the build is what says
          # whether the two agree.
          key: linux-floor-6.15-built-v3

      - name: Fetch and prepare 6.15
        if: steps.floorcache.outputs.cache-hit != 'true'
        run: |
          set -eu
          curl -sSLo /tmp/linux.tar.xz \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.15.tar.xz
          mkdir -p "$HOME/linux-floor"
          tar -xf /tmp/linux.tar.xz -C "$HOME/linux-floor" --strip-components=1
          make -C "$HOME/linux-floor" defconfig
          # A FULL BUILD, which is what Documentation/kbuild/modules.rst
          # asks for in as many words: "modules_prepare will not build
          # Module.symvers ... therefore, a full kernel build needs to be
          # executed". Two cheaper targets were tried first and neither
          # writes that file. modules_prepare leaves the tree with no
          # symbol table at all, which does not refuse an external module
          # build, it accepts every compile and then reports every symbol
          # undefined at modpost, memcpy and kfree included. Building
          # vmlinux alone is not enough either. This is the expensive step
          # and the reason the tree is cached on the tag.
          make -C "$HOME/linux-floor" -j"$(nproc)"

      # The tree is asserted to BE the floor before it is built against.
      # A cache restored from a bumped key, or a tarball that redirected,
      # would otherwise report a green floor build against some other kernel.
      - name: The prepared tree is 6.15 and carries a symbol table
        run: |
          set -eu
          v=$(make -s -C "$HOME/linux-floor" kernelversion)
          echo "prepared tree reports $v"
          case "$v" in
            6.15*) ;;
            *) echo "::error::the floor tree is $v, not 6.15"; exit 1 ;;
          esac
          # Asserted rather than assumed, because a tree with no symbol
          # table does not refuse the build: it accepts every compile and
          # reports every symbol undefined at modpost, which reads as a
          # defect in this module rather than a gap in the kernel tree.
          # That is what the first run of this job did.
          sym="$HOME/linux-floor/Module.symvers"
          [ -s "$sym" ] || { echo "::error::no Module.symvers in the floor tree"; exit 1; }
          n=$(wc -l < "$sym")
          echo "Module.symvers carries $n symbol(s)"
          [ "$n" -gt 1000 ] || { echo "::error::Module.symvers has only $n symbols"; exit 1; }

      - name: Module build at the floor
        run: |
          # set +e for the same reason as the other build step: under -e a
          # nonzero exit would end the step before rc is read.
          set +e
          sh script/build-check.sh "$HOME/linux-floor"
          rc=$?
          # COULD-NOT-RUN is a real failure here. The steps above exist to
          # provide the tree, so its absence means one of them silently did
          # nothing, and a skip would report that as a pass.
          [ "$rc" = 0 ] || { echo "::error::the module does not build at 6.15"; exit 1; }
