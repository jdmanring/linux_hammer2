# Every gate, on every push and pull request.
#
# The syntax gate needs the kernel of record, 7.3, which is the module's
# floor. A hosted runner has no such headers, so that gate reports exit 2,
# could-not-run, and this job records it as a skip and never as a pass.
# The repository gates are POSIX sh over grep, sed and git and run on any
# runner; they are what a documentation-only patch breaks.
name: CI

on:
  push:
  pull_request:
  # On demand, so a verdict on a commit never needs an empty commit.
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test-history.sh resolves every roadmap row's commit hash, so a
          # shallow clone would fail it on rows older than the fetch depth.
          fetch-depth: 0

      - name: Toolchain and kernel headers
        run: |
          sudo apt-get update -qq
          # libxxhash-dev turns the vectors gate's behavioural half from
          # COULD-NOT-RUN into a real run: without an xxHash to link, it
          # checks the source contract only and says so.
          sudo apt-get install -y clang libxxhash-dev || echo "toolchain incomplete"

      - name: Kernel style checker, pinned to the kernel of record
        run: |
          # The baseline records this file's sha256, so the gate identifies
          # the checker by content rather than by what anyone says it is.
          # v7.3-rc1 because the checker should be the one shipping with the
          # kernel this tree compiles against, which is also its floor.
          curl -sSLo /tmp/checkpatch.pl \
            https://raw.githubusercontent.com/torvalds/linux/v7.3-rc1/scripts/checkpatch.pl
          echo "CHECKPATCH=/tmp/checkpatch.pl" >> "$GITHUB_ENV"

      # The provenance gate re-runs every "identical" row through cmp when
      # the origin clone is present; without it the gate exits 2. The
      # commit comes from the CSV so it is pinned in one place, and a
      # failed clone leaves the gate could-not-run rather than failing.
      - name: Origin clone for the provenance gate
        continue-on-error: true
        run: |
          set +e
          commit=$(awk -F, '$2 == "freebsd-hammer2-upstream" {print $3; exit}' \
            doc/provenance.csv)
          [ -n "$commit" ] || { echo "::warning::no freebsd row in the CSV"; exit 0; }
          d="$HOME/Projects/freebsd-hammer2-upstream"
          mkdir -p "$HOME/Projects"
          git clone --quiet https://github.com/kusumi/freebsd_hammer2 "$d" || {
            echo "::warning::clone failed; the provenance gate stays COULD-NOT-RUN"
            exit 0
          }
          git -C "$d" checkout --quiet "$commit" || {
            echo "::warning::$commit not in the clone; gate stays COULD-NOT-RUN"
            rm -rf "$d"
            exit 0
          }
          echo "origin clone at $commit"

      # Vale for the prose gate, pinned by version and checksum: a different
      # vale reports a different finding set on unchanged prose. A failed
      # install is a failure, since the gate would otherwise report
      # could-not-run and the run would stay green.
      - name: Prose checker, pinned
        run: |
          set -eu
          v=3.18.0
          sha=a6f71a75a12fe689345b754f2412b90367fe33648abb7d200fa19eaadc2dbf6d
          curl -sfL -o /tmp/vale.tgz \
            "https://github.com/errata-ai/vale/releases/download/v$v/vale_${v}_Linux_64-bit.tar.gz"
          echo "$sha  /tmp/vale.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/vale.tgz -C "$HOME/.local/bin" vale
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vale" --version

      # No module build here: the pre-push hook builds against the kernel
      # of record on the maintainer's machine, which a hosted runner lacks.
      # The gate list is derived from script/, never typed. Exit 2 is a
      # skip; a failure outranks it, with rc kept per gate.
      - name: Gates (every script/test-*.sh)
        run: |
          set +e
          rc=0 ran=0 unrun=0
          for g in script/test-*.sh; do
            echo "::group::$g"
            bash "$g"
            s=$?
            echo "::endgroup::"
            case "$s" in
              0) ran=$((ran+1)) ;;
              2) unrun=$((unrun+1)); echo "::warning::$g COULD-NOT-RUN on this runner" ;;
              *) rc=1; echo "::error::$g failed with $s" ;;
            esac
          done
          echo "$ran gate(s) ran, $unrun could not run"
          [ "$rc" = 0 ] || exit 1
          [ "$ran" -gt 0 ] || { echo "::error::every gate declined"; exit 1; }

      # The selftests check the provenance prints a loosened run depends on.
      - name: Gate selftests (the provenance prints)
        run: |
          set +e
          rc=0
          # Matched on the implementing test, not the flag name, which a
          # comment elsewhere also carries.
          for g in $(command grep -l '"${1:-}" = "--selftest"' script/test-*.sh); do
            bash "$g" --selftest
            s=$?
            case "$s" in
              0) ;;
              2) echo "::warning::$g selftest COULD-NOT-RUN here" ;;
              *) rc=1; echo "::error::$g selftest failed with $s" ;;
            esac
          done
          exit "$rc"
