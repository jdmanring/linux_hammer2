# Prose rules for every tracked markdown file, read by script/test-doc-prose.sh.
#
# The rules under styles/Hammer2 are house YAML, so the gate runs with no
# `vale sync` and no network; a gate that needs a download fails on a fresh
# clone.

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = Hammer2

# Store hashes are not prose. Inline code and fenced blocks need no
# exclusion here: vale's markdown parser already skips both, and a
# BlockIgnores for fences was measured to suppress prose after a fence
# instead. `script/test-doc-prose.sh --selftest` plants a violation after a
# fence and requires the finding, so the claim that vale skips fences
# without skipping what follows them is checked on every run of the gate
# that cares. It also plants one in plain prose, so a run that finds
# nothing is distinguishable from rules that stopped firing.
TokenIgnores = (\/nix\/store\/\S+)
