# Prose linting. Structure is `scripts/lint-docs.py`; this file covers sentences.
#
# Deliberately self-contained: the rules in styles/ArtNix are house YAML, so the
# gate runs with no `vale sync` and no network. Vale's packaged Google and
# Microsoft styles are worth adding later, but a gate that needs a download is a
# gate that fails on a fresh clone.
#
# Install: pacman -S vale        (Artix extra, 3.17.1 as of 2026-08-11)

StylesPath = styles
MinAlertLevel = warning

[*.md]
BasedOnStyles = ArtNix

# Store hashes are not prose. This is the STORE-PATH half only, and it was
# probed rather than assumed: a file containing a bare /nix/store/... path gains
# a finding without it and loses it with it.
#
# THE BACKTICK HALF WAS HERE UNTIL 2026-08-11 AND WAS THE SAME DEFECT AS
# BlockIgnores, ONE LINE DOWN. `[^`]+` pairs backticks across the document, so a
# backtick INSIDE a fenced block pairs with a later one and swallows the prose
# between them. Reproduced: a file with two fenced blocks, one containing a
# backtick, reports findings on lines 1 and 7 with the half present and on 1, 7,
# 13 and 14 without it. Two real corpora show a delta of 0, which is why it
# survived the first sweep - a zero delta measures the corpus, not the
# exclusion.
#
# It also protected nothing. Vale's markdown parser already skips inline code:
# a probe reading "Use `behaviour` as the flag name" reports 0 findings with the
# half and 0 without. So it bought no exclusion and cost real prose.
#
# Found by the specification session, who reproduced it and declined to change a
# file two repositories share on evidence that thin. The probe that settled it
# is the same one that settled BlockIgnores: ask whether the exclusion can
# exclude, not whether the corpus moved.
TokenIgnores = (\/nix\/store\/\S+)

# THERE IS NO BlockIgnores HERE, DELIBERATELY, AND IT IS NOT AN OVERSIGHT.
#
# This config carried `BlockIgnores = (?s) *(```.*?```)` from the first commit
# until 2026-08-11. Vale's markdown parser ALREADY skips fenced code blocks, so
# it excluded nothing - and it silently suppressed prose sitting after a fence.
# Measured over the governed corpus: 26 findings with it, 72 without, and 0 of
# those 72 land inside a fenced block. The whole delta is real prose the gate
# never opened. AmericanSpelling went 0 -> 29: a rule that fires on its own
# probe and had never once fired on a document.
#
# WHICH regions it swallowed is NOT characterized, and the honest statement is
# the effect rather than the pairing rule. It is not "everything after the first
# fence": PLAN.md lost 25 findings and docs/gui-service-management.md lost none,
# and the specification repo's corpus - measured with both configs on the same
# day - shows a delta of exactly 0 across 682 findings, including a document
# with six fences. So the damage depends on document structure in a way one
# minimal repro pins but no count here explains. The repro is the shape probe.
#
# The failure direction is the bad one. A clean corpus and an unexamined one
# print the same thing, and this gate had six live probes the whole time,
# because every probe was a bare one-line file with no fence - a shape no real
# document in this tree has. The probe has to carry the CORPUS's shape, not just
# the rule's. `lint-prose.sh --selftest` and `test-prose.nix` now both assert
# that a finding survives a fenced block above it.
#
# Do not re-add it to silence findings inside code. If that ever happens, vale's
# native handling has changed, and the fix is a probe that demonstrates it.
